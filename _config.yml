# Website identity. Restart Jekyll after changing this file.
title: "Bo Peng / 彭博"
name: "Bo Peng"
description: "Bo Peng · AI Agents, Evaluation, Post-Training & Causal Reasoning"
url: "https://pengbo807.github.io"
baseurl: ""
repository: "pengbo807/pengbo807.github.io"
locale: "en-US"
timezone: "Asia/Shanghai"
encoding: "utf-8"

author:
  name: "Bo Peng (彭博)"
  email: "peng_bo2019@sjtu.edu.cn"

# Content pages; personal source assets and maintenance files stay offline.
include:
  - _pages
exclude:
  - images/portraits
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .bundle
  - vendor

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Preserve the sitemap, feed, and existing /about/ redirects on GitHub Pages.
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-redirect-from
